# Production docker-compose for a self-hosted GLANCEvault.
#
# This pulls the prebuilt image from the GitHub Container Registry rather than
# building locally. See docker-compose.example.yml for the build-from-source
# variant. All three GLANCE apps (dayGLANCE, lastGLANCE, lifeGLANCE) point at
# this one server.
#
# Quick start:
#   1. Set GLANCEVAULT_DEVICE_TOKEN in a .env file next to this one (and
#      optionally GLANCEVAULT_ALLOWED_ORIGINS). See .env.example.
#   2. docker compose up -d
#   3. curl http://localhost:8080/healthz
#
# Sit this behind a TLS-terminating reverse proxy in production (see the Caddy
# stanza in the README). The port is bound to localhost by default so the server
# is reached through the proxy rather than exposed directly.

services:
  glancevault:
    image: ghcr.io/glance-apps/glance-vault:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Required: the single device auth token. Set it in .env.
      GLANCEVAULT_DEVICE_TOKEN: ${GLANCEVAULT_DEVICE_TOKEN:?set GLANCEVAULT_DEVICE_TOKEN in your .env}
      # Optional: comma-separated browser origins allowed for CORS. Empty by
      # default, which permits no cross-origin requests.
      GLANCEVAULT_ALLOWED_ORIGINS: ${GLANCEVAULT_ALLOWED_ORIGINS:-}
      GLANCEVAULT_PORT: "8080"
      GLANCEVAULT_STORAGE_PATH: /data/glancevault.db
      # Optional: auth model, "shared" (default) or "per-account". Per-account
      # gives every device its own credential (via POST /enroll) and binds it
      # to one account — required for multi-tenant hosting and for quotas to
      # be real enforcement. See the README before switching an existing
      # deployment: every device must enroll before it can sync again.
      GLANCEVAULT_AUTH_MODE: ${GLANCEVAULT_AUTH_MODE:-}
      # Required only when GLANCEVAULT_AUTH_MODE=per-account: the bootstrap
      # secret devices exchange for per-device credentials at POST /enroll.
      GLANCEVAULT_ENROLLMENT_SECRET: ${GLANCEVAULT_ENROLLMENT_SECRET:-}
      # Optional per-account quotas (unset = no enforcement). See .env.example.
      GLANCEVAULT_QUOTA_STORAGE_MB: ${GLANCEVAULT_QUOTA_STORAGE_MB:-}
      GLANCEVAULT_QUOTA_ROWS: ${GLANCEVAULT_QUOTA_ROWS:-}
      GLANCEVAULT_QUOTA_INTENTS: ${GLANCEVAULT_QUOTA_INTENTS:-}
      GLANCEVAULT_QUOTA_UPLOADS: ${GLANCEVAULT_QUOTA_UPLOADS:-}
      GLANCEVAULT_QUOTA_SSE_PER_ACCOUNT: ${GLANCEVAULT_QUOTA_SSE_PER_ACCOUNT:-}
      # Every other optional setting, passed through so a line in .env actually
      # reaches the server. Unset in .env = empty here = the server's own
      # default (config.ts treats an empty value as unset). See .env.example.
      GLANCEVAULT_CONFIG: ${GLANCEVAULT_CONFIG:-}
      GLANCEVAULT_BLOB_STORE_PATH: ${GLANCEVAULT_BLOB_STORE_PATH:-}
      GLANCEVAULT_MAX_BLOB_SIZE: ${GLANCEVAULT_MAX_BLOB_SIZE:-}
      GLANCEVAULT_BLOB_RECLAIM: ${GLANCEVAULT_BLOB_RECLAIM:-}
      GLANCEVAULT_BLOB_GRACE_PERIOD_DAYS: ${GLANCEVAULT_BLOB_GRACE_PERIOD_DAYS:-}
      GLANCEVAULT_BLOB_DEAD_DEVICE_DAYS: ${GLANCEVAULT_BLOB_DEAD_DEVICE_DAYS:-}
      GLANCEVAULT_BLOB_RECLAIM_INTERVAL_MINUTES: ${GLANCEVAULT_BLOB_RECLAIM_INTERVAL_MINUTES:-}
      GLANCEVAULT_REQUEST_LOG: ${GLANCEVAULT_REQUEST_LOG:-}
      GLANCEVAULT_TRUST_PROXY: ${GLANCEVAULT_TRUST_PROXY:-}
      GLANCEVAULT_RATE_LIMIT: ${GLANCEVAULT_RATE_LIMIT:-}
      GLANCEVAULT_RATE_LIMIT_WINDOW_SECONDS: ${GLANCEVAULT_RATE_LIMIT_WINDOW_SECONDS:-}
      GLANCEVAULT_RATE_LIMIT_MAX: ${GLANCEVAULT_RATE_LIMIT_MAX:-}
      GLANCEVAULT_MAX_SSE_CONNECTIONS: ${GLANCEVAULT_MAX_SSE_CONNECTIONS:-}
      GLANCEVAULT_UPLOAD_SESSION_TTL_HOURS: ${GLANCEVAULT_UPLOAD_SESSION_TTL_HOURS:-}
      GLANCEVAULT_UPLOAD_SESSION_SWEEP_MINUTES: ${GLANCEVAULT_UPLOAD_SESSION_SWEEP_MINUTES:-}
    volumes:
      # Named volume holding the SQLite database file, so it survives restarts.
      # To run as a non-default user (e.g. Unraid's nobody:users, 99:100),
      # replace this with a bind mount you own on the host and add a
      # `user: "99:100"` line above — see "Running as a specific user" in the
      # README.
      - glancevault-data:/data
    healthcheck:
      # Hit the public /healthz endpoint using the node runtime in the image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  glancevault-data:
